[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "instagram-edits-mcp"
version = "0.2.0"
description = "Local, hardened MCP bridge to the automation server built into Instagram Edits for Mac."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alberto Mier" }]
keywords = ["instagram", "instagram-edits", "edits", "reels", "mcp", "mcp-server", "model-context-protocol", "macos"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Video :: Non-Linear Editor",
  "Typing :: Typed",
]
# Standard library only, on purpose: see docs/ARCHITECTURE.md ("Por qué sin dependencias").
dependencies = []

[project.scripts]
instagram-edits-mcp = "instagram_edits_mcp.cli:main"

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.hatch.build.targets.sdist]
exclude = ["/.github", "/.claude-plugin"]

[tool.hatch.build.targets.wheel]
packages = ["src/instagram_edits_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
markers = ["macos: needs macOS tools (lsof, codesign)"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "PT", "RUF"]
ignore = ["S101", "S603"]  # asserts in tests; subprocess calls use fixed absolute paths and no shell

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S110", "S310", "S607"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]
