name: CI

# No secrets, no publishing, read-only token.
#
# BEFORE ENABLING: pin every `uses:` to a full 40-character commit SHA (keep the tag as a comment),
# for example `actions/checkout@<sha> # v4.2.2`. Tags are mutable; SHAs are not. They were left as
# tags here only because looking the SHAs up needs network access.

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        python: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4  # TODO: pin to SHA
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5  # TODO: pin to SHA
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies (pinned)
        run: python -m pip install --disable-pip-version-check "pytest==9.1.1"
      - name: Tests
        run: python -m pytest
      - name: Validate plugin manifests
        run: python -I -c "import json; [json.load(open(p)) for p in ('.claude-plugin/plugin.json', '.claude-plugin/marketplace.json')]"
      - name: Launcher smoke test
        env:
          INSTAGRAM_EDITS_MCP_KEYCHAIN: "off"
        run: |
          bin/instagram-edits-mcp --version
          bin/instagram-edits-mcp config
